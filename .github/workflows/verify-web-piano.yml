name: Isolated Keyra Chromium verification

on:
  push:
    branches: [qa/web-callbacks-20261126]
    paths: [.github/workflows/verify-web-piano.yml]

permissions:
  contents: read
  actions: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the website host, controls and browser test
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: voho/protocodus.github.io
          ref: 94ffa6073a6816d9cc32dd36bd4eaae7200c9fb8
          sparse-checkout: |
            fun/keyra
            fun/shared
            assets/js
            assets/fonts
            assets/images
            product/keyra
            tests/keyra
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Assemble the website and verified renderer artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45873279181 --repo protocodus/virtual-instrument-keyra --name keyra-web-build --dir "$RUNNER_TEMP/piano-build"
          cp -a "$RUNNER_TEMP/piano-build/." fun/keyra/
          sha256sum -c <<'HASHES'
          b98ef68895943fa0532f3c647a31f938f73c151e73f8cd8bdbf3a8ddb13b92f2  fun/keyra/dsp/core.mjs
          0b680f1cac29fa021e16954fb3148cf3f006c453c29a658d1552b244c1b17b83  fun/keyra/dsp/keyra-simd.wasm
          HASHES
      - name: Install pinned Chromium and run the browser regression
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          node tests/keyra/browser.mjs
