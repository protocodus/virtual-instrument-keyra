name: Build Keyra browser DSP
on:
  push:
    branches: [build/browser-dsp-20261126]
    paths: [.browser-build-request, .github/workflows/keyra-web-dsp.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:13
    steps:
      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git clang-19 lld-19 wasi-libc libc++-19-dev-wasm32 libclang-rt-19-dev-wasm32 binaryen g++ python3 nodejs
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compile the specified website bridge against the instrument
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          read -r checkout < .browser-build-request
          git clone --filter=blob:none --no-checkout --single-branch --branch build/keyra-dsp-20261126 https://github.com/voho/protocodus.github.io.git /tmp/site
          git -C /tmp/site sparse-checkout set scripts/keyra fun/keyra/dsp
          git -C /tmp/site checkout --detach "$checkout"
          shasum=$(git -C /tmp/site rev-parse HEAD)
          test "$checkout" = "$shasum"
          bash /tmp/site/scripts/keyra/build-dsp.sh "$GITHUB_WORKSPACE"
          cp -r /tmp/site/fun/keyra /tmp/keyra-web-build
      - name: Load independently staged native comparison
        run: |
          git -C /tmp/site fetch --depth=1 origin 8130e15a0ec3932ad628dab4f032fb4dcea4c477
          git -C /tmp/site sparse-checkout add tests/keyra
          git -C /tmp/site checkout FETCH_HEAD -- tests/keyra
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keyra-web-build
          path: /tmp/keyra-web-build
          retention-days: 7
      - name: Record public release assets for verified transfer
        run: |
          python3 - <<'PY'
          import base64, hashlib
          from pathlib import Path
          root = Path('/tmp/keyra-web-build')
          files = ['dsp/core.mjs', 'dsp/keyra-simd.wasm', 'metadata.js', 'dsp/LICENSE',
                   'dsp/THIRD_PARTY_NOTICES.md', 'dsp/SALAMANDER-ATTRIBUTION.md', 'dsp/SALAMANDER-CC-BY-3.0.txt']
          for name in files:
              data = (root / name).read_bytes()
              oid = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              print('KEYRA_FILE', name, len(data), oid, hashlib.sha256(data).hexdigest())
              for i in range(0, len(data), 6000):
                  print('KEYRA_CHUNK', name, i, base64.b64encode(data[i:i+6000]).decode())
          PY
      - name: Compare both renderers to the pinned native engine
        run: |
          cd /tmp/site
          node tests/keyra/parity.mjs "$GITHUB_WORKSPACE"
