name: Diagnose Keyra JavaScript optimization tier
on:
  push:
    branches: [qa/web-callbacks-20261126]
    paths: [.github/workflows/diagnose-v8-tier.yml]
permissions:
  contents: read
  actions: read
jobs:
  tier:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22.23.5'}
      - name: Retrieve verified engine and full warm optimizer trace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45873279181 --repo protocodus/virtual-instrument-keyra --name keyra-web-build --dir fun/keyra
          gh run download 45878268312 --repo protocodus/virtual-instrument-keyra --name keyra-warmed-v8-profiles --dir trace
          node --v8-options | grep -A1 -E 'max-optimized-bytecode-size|max-maglev-inlined-bytecode-size|huge-'
          grep -E 'JSFunction (\$59|\$20|\$30|render) |too big|too large|disabled optimization' trace/profile.log | tail -90 || true
      - name: Inspect bytecode lengths and warm tier
        run: |
          cat > tier.mjs <<'JS'
          import { KeyraDSP } from './fun/keyra/dsp/piano.mjs';
          const piano = new KeyraDSP(48000);
          const l = new Float32Array(128), r = new Float32Array(128);
          const play = () => piano.render(l, r);
          for (const note of [48,55,60,64,71]) piano.noteOn(note, 87);
          piano.controlChange(64, 102);
          for (let i=0; i<256; ++i) play();
          const start = performance.now();
          for (let i=0; i<384; ++i) play();
          console.log('MEAN warm callback', (performance.now()-start)/384);
          console.log('STATUS normal exported render', %GetOptimizationStatus(piano.core.render));
          console.log('STATUS normal wrapper render', %GetOptimizationStatus(piano.render));
          JS
          node --print-bytecode --print-bytecode-filter='$59' --trace-opt-verbose --trace-opt --trace-deopt --allow-natives-syntax tier.mjs > tier.log 2>&1
          grep -E 'Bytecode length|STATUS|too big|too large|disabled optimization|JSFunction \$59 ' tier.log | tail -65
