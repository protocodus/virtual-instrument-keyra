name: Keyra CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keyra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core and reference tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKEYRA_BUILD_PLUGIN=OFF
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Test portable benchmark replay paths
        run: python3 Tests/test_recording_parity_paths.py

  sanitizers:
    name: Live DSP sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DKEYRA_BUILD_PLUGIN=OFF -DKEYRA_BUILD_REFERENCE=OFF
          -DKEYRA_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-asan --parallel 2
      - name: Test
        run: ctest --test-dir build-asan --output-on-failure

  plugin:
    name: Linux VST3 and standalone
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 2cdfca8feb300fb424002ba2c2751569e5bacb64
          path: .ci/JUCE
          persist-credentials: false
      - name: Install Linux build and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxcursor-dev libgl1-mesa-dev xvfb xauth unzip
      - name: Configure
        run: >-
          cmake -S . -B build-plugin -DCMAKE_BUILD_TYPE=Release
          -DKEYRA_BUILD_PLUGIN=ON -DKEYRA_JUCE_PATH="$PWD/.ci/JUCE"
      - name: Build
        run: cmake --build build-plugin --parallel 2
      - name: Test with a display
        run: xvfb-run -a ctest --test-dir build-plugin --output-on-failure
      - name: Validate the built VST3
        run: |
          curl --fail --location --retry 3 \
            https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip \
            --output pluginval.zip
          printf '%s  %s\n' c01c49d8063965c4c2dea8324468336768f5c9139e0b1caebde14c2400b55352 pluginval.zip | sha256sum --check -
          unzip -q pluginval.zip -d pluginval
          chmod +x pluginval/pluginval
          xvfb-run -a pluginval/pluginval --strictness-level 5 \
            --random-seed 20261026 --timeout-ms 60000 \
            --validate "$PWD/build-plugin/Keyra_artefacts/Release/VST3/Keyra.vst3"
