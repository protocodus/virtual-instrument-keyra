name: Resolve Keyra wasm2js function symbols
on:
  push:
    branches: [qa/web-callbacks-20261126]
    paths: [.github/workflows/map-profile-symbols.yml]
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 8
    steps:
      - name: Install matching WASI and Binaryen tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git clang-19 lld-19 wasi-libc libc++-19-dev-wasm32 libclang-rt-19-dev-wasm32 binaryen wabt binutils python3 llvm-19
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4edf82344b1c53dea1eb50c19e5c332287779d0c
          sparse-checkout: Source/DSP
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: voho/protocodus.github.io
          ref: c065e6853daf80e4690700f79e801c26d2519939
          sparse-checkout: scripts/keyra
          path: website
          persist-credentials: false
      - name: Map identical generated function bodies to named translation
        run: |
          cd /tmp
          src="$GITHUB_WORKSPACE/Source/DSP"
          web="$GITHUB_WORKSPACE/website/scripts/keyra"
          build() {
            clang++-19 --target=wasm32-wasi --sysroot=/usr -mexec-model=reactor -std=c++17 -fno-exceptions -fno-rtti -ffp-contract=off \
              -Wl,--initial-memory=67108864 -Wl,--max-memory=67108864 -Wl,-z,stack-size=2097152 -I"$src" \
              -O2 -DKEYRA_FORCE_SCALAR -fno-unroll-loops -fno-vectorize -fno-slp-vectorize "$@" \
              "$src/PianoModel.cpp" "$src/KeyraEngine.cpp" "$web/bridge.cpp" -o scalar.wasm
          }
          mkdir -p /tmp/keepbin
          cat > /tmp/keepbin/wasm-opt <<'SH'
          #!/bin/sh
          cp "$1" /tmp/raw-linked.wasm
          exec /usr/bin/wasm-opt "$@"
          SH
          chmod +x /tmp/keepbin/wasm-opt
          build -B/tmp/keepbin -Wl,-Map=/tmp/link.map
          test -f /tmp/raw-linked.wasm
          wasm2wat /tmp/raw-linked.wasm --generate-names -o raw.wat
          python3 - <<'PY'
          import re
          from pathlib import Path
          body=Path('raw.wat').read_text()
          decl=re.findall(r'^  \(func \$([^ ]+)',body,re.M)
          print('RAW',len(decl),decl[:5])
          records={}
          for line in Path('/tmp/link.map').read_text().splitlines():
              match=re.search(r'^\s*-\s+([a-f0-9]+)\s+[a-f0-9]+\s+.*:\(([^()]+)\)\s*$',line)
              if match:
                  records.setdefault(int(match[1],16),match[2])
          order=[s for addr,s in sorted(records.items())]
          first=order.index('__wasm_call_ctors')
          order=order[first:first+len(decl)]
          if len(decl)!=len(order): raise ValueError((len(decl),len(order)))
          m=dict(zip(decl,order))
          # Limit to function identifiers. Text copied from native symbol table is mangled ASCII.
          body=re.sub(r'(?<!\w)\$([a-zA-Z0-9_$\.]+)',lambda x:'$'+m.get(x[1],x[1]),body)
          Path('native.wat').write_text(body)
          PY
          head -c 1 native.wat > /dev/null
          wat2wasm native.wat --debug-names -o native.wasm
          wasm-opt native.wasm --enable-bulk-memory -O2 -g -o optimized-named.wasm
          wasm-objdump -d optimized-named.wasm | grep ' func\[' | c++filt -n | head -65 | cut -c 1-310
          wasm2wat optimized-named.wasm --generate-names -o linked.wat
          wasm2js scalar.wasm -O2 -o plain.js
          wasm2js linked.wat --enable-bulk-memory -O2 -o named.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          def funcs(path):
              code=Path(path).read_text()
              pattern=re.compile(r'^ function ([\w$]+)\(',re.M)
              hits=list(pattern.finditer(code))
              return [(m[1],code[m.start():(hits[i+1].start() if i+1<len(hits) else code.find('\n }',m.start())+3)]) for i,m in enumerate(hits)]
          plain=funcs('plain.js')
          named=funcs('named.js')
          print('FUNCTION COUNTS',len(plain),len(named))
          def shape(body):
              return re.sub(r'\b(?:HEAP\w*|Math\w*)\b|[a-zA-Z_$][a-zA-Z0-9_$]*','_',re.sub(r'//[^\n]*','',body))
          shapes={}
          for nm,body in named:
              shapes.setdefault(shape(body),[]).append(nm)
          for i,(nm,body) in enumerate(plain):
              match=shapes.get(shape(body),[])
              if len(match)==1:
                  print('MATCH',nm,match[0])
              elif i<len(named):
                  print('ORDER',nm,named[i][0],'lines',body.count('\n'),named[i][1].count('\n'))
          PY
          wasm-objdump -d optimized-named.wasm | grep ' func\[' > /tmp/linked-names
          perl -ne 'if(/func\[(\d+)\] <(.*)>:/ && grep { $_ == $1 } qw(23 24 33 34 36 50 62)){print "$1 $2\n"}' /tmp/linked-names | c++filt -n
